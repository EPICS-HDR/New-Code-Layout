<link rel="stylesheet" href="/static/css/global.css">
<link rel="stylesheet" href="/static/css/Heading.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<header class="navbar">
  <div class="logo-container">
    <a href="/">
      <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/33a3523fd6976908bc3437ef17e24417ccd1f945" alt="Logo" class="logo-header">
    </a>
  </div>
  <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
    <span class="menu-toggle-bar"></span>
    <span class="menu-toggle-bar"></span>
    <span class="menu-toggle-bar"></span>
  </button>
  <nav class="nav-menu" id="nav-menu">
    <a href="/" class="nav-link">Home</a>
    <a href="/about.html" class="nav-link">About Us</a>
    <div class="dropdown" id="services-dropdown">
      <a href="#" class="nav-link">Services &#9660;</a>
      <div class="dropdown-content">
        <a href="/map.html" class="dropdown-link">Interactive Map</a>
        <a href="/maptabs.html" class="dropdown-link">Custom Graphs</a>
      </div>
    </div>
  </nav>
</header>
<script>
  (function() {
    var menuToggle = document.getElementById('menu-toggle');
    var navMenu = document.getElementById('nav-menu');
    var servicesDropdown = document.getElementById('services-dropdown');
    if (menuToggle) {
      menuToggle.addEventListener('click', function() { navMenu.classList.toggle('open'); });
    }
    if (servicesDropdown && window.innerWidth <= 640) {
      servicesDropdown.querySelector('.nav-link').addEventListener('click', function(e) {
        e.preventDefault();
        servicesDropdown.classList.toggle('active');
      });
    }
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.navbar')) {
        navMenu.classList.remove('open');
        if (servicesDropdown) servicesDropdown.classList.remove('active');
      }
    });
  })();
</script>

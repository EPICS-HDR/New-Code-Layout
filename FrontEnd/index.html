<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standing Rock Community</title>

  <!-- CSS -->
  <link rel="stylesheet" href="static/css/Heading.css">
  <link rel="stylesheet" href="static/css/home.css">

  <!-- Firebase SDKs -->
  <script defer src="/__/firebase/12.11.0/firebase-app-compat.js"></script>
  <script defer src="/__/firebase/12.11.0/firebase-auth-compat.js"></script>
  <script defer src="/__/firebase/12.11.0/firebase-database-compat.js"></script>
  <script defer src="/__/firebase/12.11.0/firebase-firestore-compat.js"></script>
  <script defer src="/__/firebase/12.11.0/firebase-functions-compat.js"></script>
  <script defer src="/__/firebase/12.11.0/firebase-messaging-compat.js"></script>
  <script defer src="/__/firebase/12.11.0/firebase-storage-compat.js"></script>
  <script defer src="/__/firebase/12.11.0/firebase-analytics-compat.js"></script>
  <script defer src="/__/firebase/12.11.0/firebase-remote-config-compat.js"></script>
  <script defer src="/__/firebase/12.11.0/firebase-performance-compat.js"></script>
  <script defer src="/__/firebase/init.js"></script>
</head>
<body>
  <!-- Navbar -->
  <div id="navbar-placeholder"></div>
  <script>
    fetch('services/templates/HTML/navbar.html')
      .then(resp => resp.text())
      .then(data => document.getElementById('navbar-placeholder').innerHTML = data);
  </script>

  <!-- Main Content -->
  <main class="landing-page">
    <!-- Include homepage content from your original homepage.html -->
    <section class="goals-section">
      <div class="content-container">
        <div class="text-column">
          <h2 class="section-subtitle">What Are Our Goals?</h2>
          <h3 class="section-title">Assist Standing Rock</h3>
          <p>Home to both the Lakota and Dakota people...</p>
        </div>
        <div class="image-column">
          <img src="static/images/standing-rock-hero.jpg" alt="Standing Rock Community">
        </div>
      </div>
    </section>

    <!-- Services Section -->
    <section id="services">
      <article class="service-card">
        <a href="services/templates/HTML/map.html">Interactive Maps</a>
      </article>
      <article class="service-card">
        <a href="services/templates/HTML/maptabs.html">Custom Graphs</a>
      </article>
    </section>

    <!-- Footer -->
    <footer class="contact-section">
      <a href="mailto:Epics-hdr@ecn.purdue.edu">Contact Us</a>
    </footer>
  </main>

  <p id="load">Firebase SDK Loading…</p>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const loadEl = document.querySelector('#load');
      try {
        const app = firebase.app();
        const features = ['auth','database','firestore','functions','messaging','storage','analytics','remoteConfig','performance']
          .filter(f => typeof app[f] === 'function');
        loadEl.textContent = `Firebase SDK loaded with ${features.join(', ')}`;
      } catch(e) {
        console.error(e);
        loadEl.textContent = 'Error loading Firebase SDK.';
      }
    });
  </script>
</body>
</html>

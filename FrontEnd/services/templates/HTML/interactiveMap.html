Purpose: Main interactive map UI for selecting data layers and station locations.

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Standing Rock Environmental</title>

  <!-- Mapbox and Plotly -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.5.0/mapbox-gl.js"></script>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.5.0/mapbox-gl.css" rel="stylesheet" />

  <!-- Local CSS -->
  <link rel="stylesheet" href="{% static 'css/maptabs.css' %}">
  <link rel="stylesheet" href="{% static 'css/map.css' %}">
  <link rel="stylesheet" href="{% static 'css/Heading.css' %}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
  {% include "HTML/navbar.html" %}
  <style>
    #map { top: 20%; left: 10%; width: 80%; height: 70%}

    .modal {
      position: relative;
      top: 100vh;
      left: 20%;
      z-index: auto;
      display: none;
      width: 60%;
      overflow-y: visible;
      padding: 20px;
      max-height: 400%;
      background-color: #fefefe;
      border: 1px solid #888;
    }

    .modal-content {
      width: 100%;
      max-width: 95%;
      margin: 0 auto;
    }

    .modal-content h3 {
      margin: 0 0 10px;
      font-size: 1.1rem;
      color: #0f172a;
    }

    .modal-dataset-select {
      margin-bottom: 12px;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #dfe4f3;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .modal-graph-container {
      width: 100%;
      min-height: 300px;
    }

    .modal-loading {
      color: #667085;
      padding: 12px 0;
      font-size: 0.9rem;
    }

    @media screen and (max-width: 768px) {
      #map { top: 0; left: 0; width: 100%; height: 400px; }
      #map-legend { display: none; }
      .modal { position: relative; top: 0; left: 0; width: 100%; padding: 15px; max-height: none; overflow-y: auto; }
      .modal-content { max-width: 100%; }
    }
  </style>

  <!-- Map container -->
  <div id="map"></div>

  <!-- Legend -->
  <div id="map-legend">
    <h4>Legend</h4>
    <ul>
      <li><span class="dot" style="background-color: #140ceb;"></span>USACE Dam</li>
      <li><span class="dot" style="background-color: #f91d1d;"></span>DANR Water Quality</li>
      <li><span class="dot" style="background-color: #057c37;"></span>COCORAHS Weather</li>
    </ul>
  </div>

  <!-- Dynamic modal container — populated by openModals.js -->
  <div id="modal-container"></div>

  <!-- Inject location data from database -->
  <script>
    window.mapLocations = JSON.parse('{{ locations_json|escapejs }}');
  </script>

  <!-- JS Scripts -->
  <script src="{% static 'js/map.js' %}"></script>
  <script src="{% static 'js/updateGraphs.js' %}"></script>
  <script src="{% static 'js/openModals.js' %}"></script>

  <!-- Auto-scroll to modal on open -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const container = document.getElementById('modal-container');
      const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          mutation.addedNodes.forEach(function(node) {
            if (node.nodeType === 1 && node.classList.contains('modal')) {
              observer.observe(node, { attributes: true, attributeFilter: ['style'] });
            }
          });
          if (mutation.type === 'attributes' && mutation.attributeName === 'style') {
            const modal = mutation.target;
            if (window.getComputedStyle(modal).display !== 'none') {
              modal.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }
        });
      });
      observer.observe(container, { childList: true });
    });
  </script>
</body>
</html>

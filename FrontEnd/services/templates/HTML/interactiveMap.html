  <style>
    #map { top: 20%; left: 10%; width: 80%; height: 70%}

    .modal {
      position: relative;
      top: 100vh;
      left: 20%;
      z-index: auto;
      display: none;
      width: 60%;
      overflow-y: visible;
      padding: 20px;
      max-height: 400%;
      background-color: #fefefe;
      border: 1px solid #888;
    }

    .modal-content {
      width: 100%;
      max-width: 95%;
      margin: 0 auto;
    }

    @media screen and (max-width: 768px) {
      #map { top: 0; left: 0; width: 100%; height: 400px; }
      #map-legend { display: none; }
      .modal { position: relative; top: 0; left: 0; width: 100%; padding: 15px; max-height: none; overflow-y: auto; }

  <!-- Auto-scroll to modal -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const modals = document.querySelectorAll('.modal');
      const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          if (mutation.type === 'attributes' && mutation.attributeName === 'style') {
            const modal = mutation.target;
            const displayStyle = window.getComputedStyle(modal).display;
            if (displayStyle !== 'none') modal.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        });
      });
      modals.forEach(modal => observer.observe(modal, { attributes: true, attributeFilter: ['style'] }));
    });
  </script>

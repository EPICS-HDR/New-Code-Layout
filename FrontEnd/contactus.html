<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="/static/css/Heading.css">
  <style>
    body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background-color:#c35c5c;margin:0;padding:0;display:flex;align-items:center;justify-content:center;min-height:100vh}
    form{margin-top:150px;background-color:#de9898;padding:40px;border-radius:10px;box-shadow:0 10px 20px rgba(0,0,0,.1);width:400px;transition:transform .3s ease}
    form:hover{transform:translateY(-5px)}
    h1{text-align:center;color:#f5ebeb;margin-bottom:30px;font-size:28px}
    label{display:block;margin-bottom:8px;color:#666}
    input,select,textarea{width:calc(100% - 16px);padding:12px;margin-bottom:20px;border:1px solid #ddd;border-radius:6px;font-size:16px}
    input:focus,select:focus,textarea:focus{border-color:#4caf50}
    input[type="submit"]{background-color:#4caf50;color:#fff;cursor:pointer;font-weight:bold;border:none;padding:12px 0}
    input[type="submit"]:hover{background-color:#45a049}
    input[type="submit"]:disabled{background-color:#ddd;color:#666;cursor:not-allowed}
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>
  <script>fetch('/navbar.html').then(r=>r.text()).then(h=>document.getElementById('navbar-placeholder').innerHTML=h);</script>

  <form>
    <h1>Contact Us</h1>
    <label for="name">Your Name</label>
    <input type="text" id="name" name="name" required>
    <label for="email">Your Email</label>
    <input type="email" id="email" name="email" required>
    <label for="category">Category</label>
    <select id="category" name="category" required>
      <option value="">Select category</option>
      <option value="Comment">Comment</option>
      <option value="Concern">Concern</option>
    </select>
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="4" required></textarea>
    <input type="submit" id="submit" value="Submit" disabled>
  </form>

  <script>
    document.querySelector('form').addEventListener('input', function() {
      document.getElementById('submit').disabled =
        !(document.getElementById('name').value && document.getElementById('email').value &&
          document.getElementById('category').value && document.getElementById('message').value);
    });
  </script>
</body>
</html>
